name: Quality Verification

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SeoulMate_BE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: SeoulMate_BE/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run lint
      - name: Check benchmark formatting
        run: >-
          npx prettier --check
          package.json
          scripts/testRecommendationApi20.mjs
          tests/quantitative.test.mjs
          docs/BENCHMARK.md
