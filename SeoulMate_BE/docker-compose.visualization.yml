services:
  grafana:
    image: grafana/grafana:11.6.0
    container_name: seoulmate-benchmark-grafana
    ports:
      - "13000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/seoulmate-benchmark.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/health | grep -q ok"]
      interval: 3s
      timeout: 3s
      retries: 30

  cloudbeaver:
    image: dbeaver/cloudbeaver:25.2.4
    container_name: seoulmate-cloudbeaver
    ports:
      - "18978:8978"
    environment:
      CB_SERVER_NAME: SeoulMate Database
      CB_SERVER_URL: http://127.0.0.1:18978/
      CB_ADMIN_NAME: seoulmate-admin
      CB_ADMIN_PASSWORD: seoulmate-local-admin
    volumes:
      - seoulmate-cloudbeaver-workspace:/opt/cloudbeaver/workspace
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8978"]
      interval: 5s
      timeout: 5s
      retries: 30

  pgadmin:
    image: dpage/pgadmin4:9.7
    container_name: seoulmate-pgadmin
    ports:
      - "15050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: seoulmate@example.com
      PGADMIN_DEFAULT_PASSWORD: seoulmate-local-admin
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - seoulmate-pgadmin-data:/var/lib/pgadmin
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/misc/ping >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  seoulmate-cloudbeaver-workspace:
  seoulmate-pgadmin-data:
